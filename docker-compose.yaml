services:
  fastapi-app:
    build: ./app
    container_name: fastapi-app
    expose:
      - "8000"
    environment:
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    #networks:
    #  - app-network
    restart: unless-stopped

  cloudpub:
    image: cloudpub/cloudpub:latest
    container_name: cloudpub-tunnel
    restart: unless-stopped
    environment:
      - TOKEN=${CLOUDPUB_TOKEN}
    command: publish http fastapi-app:8000 --name gitcommentbot
    depends_on:
      - fastapi-app
    volumes:
      - cloudpub-config:/home/cloudpub

volumes:
  cloudpub-config:

#networks:
  #app-network:
    #driver: bridge